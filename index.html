<script>
'use strict';
// =====================================================================
//  DIORAMA PIXEL ART: LABORATORIOS DE IA  (bucle de 240 s, día y noche)
//  Todo se dibuja como función pura del tiempo T, así el bucle es exacto.
// =====================================================================
const cv=document.getElementById('c'),main=cv.getContext('2d');
const lc=document.createElement('canvas');lc.width=720;lc.height=405;const lg=lc.getContext('2d');
let g=main;
const W=720,H=405,LOOP=240,PI=Math.PI,TAU=PI*2;
const GY=318,FH=40,BW=150,RW=144,SY=331;
let T=0;const post=[];

// ---------- primitivas ----------
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)};
const P=(x,y,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,1,1)};
const hh=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const fr=n=>Math.floor(T*n);
const ease=k=>k<=0?0:k>=1?1:k*k*(3-2*k);
const HC={};
function hex(c){let v=HC[c];if(!v){let s=c.slice(1);if(s.length===3)s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];v=HC[c]=[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]}return v}
function mix(a,b,k){k=k<0?0:k>1?1:k;const A=hex(a),B=hex(b);let s='#';for(let i=0;i<3;i++){const v=Math.round(A[i]+(B[i]-A[i])*k);s+=(v<16?'0':'')+v.toString(16)}return s}
function disc(cx,cy,r,c){g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy)+.5);g.fillRect(cx-w,cy+dy,2*w+1,1)}}
function ell(cx,cy,rx,ry,c){g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);ry=Math.max(1,Math.round(ry));for(let dy=-ry;dy<=ry;dy++){const w=Math.floor(rx*Math.sqrt(1-dy*dy/(ry*ry))+.5);g.fillRect(cx-w,cy+dy,2*w+1,1)}}
function ring(cx,cy,r,c){g.fillStyle=c;const n=Math.ceil(TAU*r*1.6);for(let i=0;i<n;i++){const a=i/n*TAU;g.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1)}}
function ringE(cx,cy,rx,ry,c){g.fillStyle=c;const n=Math.ceil(TAU*Math.max(rx,ry)*1.6);for(let i=0;i<n;i++){const a=i/n*TAU;g.fillRect(Math.round(cx+Math.cos(a)*rx),Math.round(cy+Math.sin(a)*ry),1,1)}}
function line(x0,y0,x1,y1,c){g.fillStyle=c;x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let i=0;i<2000;i++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}

// ---------- fuente bitmap 3x5 (con Ñ, ¡ y ¿) ----------
const FONT={};
`A:010101111101101 B:110101110101110 C:011100100100011 D:110101101101110 E:111100110100111 F:111100110100100 G:011100101101011 H:101101111101101 I:111010010010111 J:001001001101010 K:101101110101101 L:100100100100111 M:101111111101101 N:110101101101101 O:010101101101010 P:110101110100100 Q:010101101110011 R:110101110101101 S:011100010001110 T:111010010010010 U:101101101101111 V:101101101101010 W:101101101111111 X:101101010101101 Y:101101010010010 Z:111001010100111 0:111101101101111 1:010110010010111 2:110001010100111 3:110001010001110 4:101101111001001 5:111100110001110 6:011100111101111 7:111001010010010 8:111101111101111 9:111101111001110 .:000000000000010 ,:000000000010100 !:010010010000010 ?:110001010000010 ¡:010000010010010 ¿:010000010100011 ::000010000010000 -:000000111000000 +:000010111010000 /:001001010100100 ':010010000000000 ":101101000000000 %:101001010100101 $:011110010011110 #:101111101111101 (:001010010010001 ):100010010010100 =:000111000111000 >:100010001010100 <:001010100010001 *:000101010101000 _:000000000000111 ^:000010111111000 ~:000111111010000 @:000101111010000 &:010101010101011 [:110100100100110 ]:011001001001011`.split(' ').forEach(e=>{FONT[e[0]]=e.slice(2)});
function txt(s,x,y,c,sc){sc=sc||1;g.fillStyle=c;x=Math.round(x);y=Math.round(y);s=String(s).toUpperCase();for(let k=0;k<s.length;k++){let ch=s[k];if(ch==='Ñ'){ch='N';g.fillRect(x,y-2*sc,3*sc,sc)}const gl=FONT[ch];if(gl&&x>-4*sc&&x<W){for(let i=0;i<15;i++)if(gl[i]==='1')g.fillRect(x+(i%3)*sc,y+((i/3)|0)*sc,sc,sc)}x+=4*sc}}
const tw=(s,sc)=>String(s).length*4*(sc||1)-(sc||1);
const txtC=(s,cx,y,c,sc)=>txt(s,cx-tw(s,sc)/2,y,c,sc);
function txtO(s,x,y,c,oc,sc){txt(s,x-1,y,oc,sc);txt(s,x+1,y,oc,sc);txt(s,x,y-1,oc,sc);txt(s,x,y+1,oc,sc);txt(s,x,y,c,sc)}
function bubble(cx,y,s,bg,fg){bg=bg||'#ffffff';fg=fg||'#23272e';const w=tw(s)+6;let x=Math.round(cx-w/2);x=Math.max(1,Math.min(W-w-1,x));y=Math.max(13,Math.round(y));cx=Math.round(Math.max(x+2,Math.min(x+w-4,cx)));
  R(x+1,y-12,w-2,9,fg);R(x,y-11,w,7,fg);R(x+1,y-11,w-2,7,bg);R(cx,y-3,2,1,fg);P(cx,y-2,fg);txt(s,x+3,y-10,fg)}
function say(cx,y,s,p,a,b,bg,fg){const q=T%p;if(q>=a&&q<b)post.push(()=>bubble(cx,y,s,bg,fg))}
function signAt(x,y,s,bg,fg,yb){const w=tw(s)+4;R(x,y+9,1,yb-y-9,'#6d5a48');R(Math.round(x-w/2),y,w,9,fg);R(Math.round(x-w/2)+1,y+1,w-2,7,bg);txt(s,Math.round(x-w/2)+2,y+2,fg)}

// ---------- personajes y utilería ----------

const GC=['#4285f4','#ea4335','#fbbc05','#34a853'];
function person(x,y,o){o=o||{};x=Math.round(x);y=Math.round(y);
  const d=o.dir||1,sk=o.skin||SKIN[0],hr=o.hair||HAIR[0],sh=o.shirt||'#778899',pa=o.pants||'#2b3046';
  const wk=o.walk!=null,wf=wk?(Math.floor(o.walk)&3):0,bob=wk&&(wf&1)?1:0;
  let by=y-3-bob;
  if(o.sit)by=y;else if(bob)R(x+2,y-4,1,4,pa);else{R(x+1,y-3,1,3,pa);R(x+3,y-3,1,3,pa)}
  R(x+1,by-5,3,5,sh);if(o.tie)R(x+2,by-5,1,3,o.tie);
  R(x,by-9,5,4,sk);R(x,by-10,5,2,hr);P(d>0?x:x+4,by-8,hr);
  if(o.vr)R(x,by-8,5,2,'#1b1f27');else{P(x+(d>0?2:0),by-7,'#1a1a1a');P(x+(d>0?4:2),by-7,'#1a1a1a')}
  if(o.glasses)R(x,by-7,5,1,'#111111');
  if(o.hat){R(x,by-11,5,2,o.hat);R(d>0?x+1:x-1,by-9,5,1,o.hat)}
  if(o.hood){R(x,by-10,5,1,sh);P(d>0?x:x+4,by-9,sh);P(d>0?x:x+4,by-8,sh)}
  const up=o.armUp;
  for(let s=0;s<2;s++){const ax=x+s*4,isUp=up==='both'||(up==='L'&&!s)||(up==='R'&&s);
    if(isUp){P(ax,by-5,sh);const rx=s?x+5:x-1;R(rx,by-9,1,4,sh);P(rx,by-10,sk)}else{R(ax,by-5,1,3,sh);P(ax,by-2,sk)}}
  if(o.bag){const bx=d>0?x+5:x-3;R(bx,by-3,3,3,'#c9a227');P(bx+1,by-4,'#8a6d12')}
}
function worker(x,y,o){o=Object.assign({sit:1},o);const d=o.dir||1,pa=o.pants||'#2b3046';
  R(d>0?x-1:x+5,y-10,1,8,'#4a4f5a');R(x,y-3,5,1,'#4a4f5a');R(x+2,y-2,1,2,'#4a4f5a');
  person(x,y-3,o);R(d>0?x+3:x-1,y-4,3,1,pa);R(d>0?x+5:x-1,y-3,1,3,pa)}
function desk(x,y,sc,wood){wood=wood||'#a07850';R(x,y-7,14,2,wood);R(x+1,y-5,1,5,wood);R(x+12,y-5,1,5,wood);R(x+4,y-14,7,6,'#23262d');R(x+5,y-13,5,4,sc||'#7fdfff');R(x+7,y-8,1,1,'#23262d')}
function plant(x,y){R(x+1,y-3,3,3,'#b5651d');R(x,y-8,5,5,'#3c9a4a');P(x+2,y-9,'#3c9a4a');P(x+1,y-6,'#2c7a3a');P(x+3,y-7,'#57b865')}
function board(x,y,w,h,lines,c){R(x,y,w,h,'#9aa0a6');R(x+1,y+1,w-2,h-2,'#ffffff');lines.forEach((l,i)=>txt(l,x+3,y+3+i*6,Array.isArray(c)?c[i]:(c||'#333333')))}
function poster(x,y,w,h,bg,lines,fg){R(x,y,w,h,bg);lines.forEach((l,i)=>txt(l,x+2,y+2+i*6,fg))}
function monitor(x,y,w,h,bg){R(x,y,w,h,'#23262d');R(x+1,y+1,w-2,h-2,bg||'#0d1117')}
function door(x,y,c1,c2){R(x,y-19,14,19,c1);R(x+1,y-18,5,18,c2);R(x+8,y-18,5,18,c2);P(x+6,y-8,'#ffffff');P(x+7,y-8,'#ffffff')}
function rack(x,y,h,seed){R(x,y-h,10,h,'#2a2e37');R(x,y-h,10,1,'#3a3f4a');for(let i=0;i<h-3;i+=3){R(x+2,y-h+2+i,2,1,hh(seed+i+fr(4)*7)>.4?'#33ff66':'#114433');R(x+6,y-h+2+i,2,1,hh(seed*3+i+fr(6)*5)>.5?'#ffaa33':'#443311')}}
function spark(cx,cy,r,c,rot){for(let i=0;i<6;i++){const a=(rot||0)+i/6*PI;line(cx-Math.cos(a)*r,cy-Math.sin(a)*r,cx+Math.cos(a)*r,cy+Math.sin(a)*r,c)}}
function llama(x,y,d,wf,graze){x=Math.round(x);const c='#f3ead6',c2='#cdbb96',l=wf&1;
  R(x+2,y-9,10,5,c);R(x+2,y-5,10,1,c2);
  R(x+3,y-4,1,l?4:3,c2);R(x+5,y-4,1,l?3:4,c2);R(x+9,y-4,1,l?4:3,c2);R(x+11,y-4,1,l?3:4,c2);
  const fx=d>0?x+11:x+1;P(d>0?x+1:x+12,y-9,c2);
  if(graze){R(d>0?fx+1:fx-1,y-8,2,5,c);R(d>0?fx+1:fx-3,y-4,4,3,c);P(d>0?fx+3:fx-2,y-3,'#222222')}
  else{R(fx,y-15,2,7,c);R(d>0?fx:fx-2,y-17,4,3,c);P(fx,y-18,c2);P(fx+1,y-18,c2);P(d>0?fx+2:fx-1,y-16,'#222222')}}

// ---------- laboratorios ----------
const LABS={
 A:{x:24,floors:4,wall:'#c8714f',wall2:'#a85a3d',trim:'#f1e7d3',room:'#f4ecdc',col:'#d97757'},
 O:{x:198,floors:5,wall:'#23272e',wall2:'#15181d',trim:'#10a37f',room:'#e9ecef',col:'#10a37f'},
 G:{x:372,floors:3,wall:'#eef1f4',wall2:'#cfd6dd',trim:'#4285f4',room:'#ffffff',col:'#4285f4'},
 M:{x:546,floors:4,wall:'#2b6fe0',wall2:'#1c55b8',trim:'#dfeaff',room:'#e6efff',col:'#3b8bff'}};
const ORD=['A','O','G','M'];
const topOf=b=>GY-b.floors*FH,doorX=b=>b.x+75;
// lanzamientos de modelos: cada 30 s alguien publica y el ranking se reordena
const REL=[[15,'A','CLAUDE 6'],[45,'O','GPT-6.1 TERRA'],[75,'G','GEMINI 4 CARBON'],[105,'M','MUSE EMBER 1.0'],[135,'O','GPT-6.2 ASTRA'],[165,'A','CLAUDE FABLE 5.3'],[195,'M','MUSE SPARK 2'],[225,'G','GEMINI 4 ARGON 2']];
const cyc=d=>((d%LOOP)+LOOP)%LOOP;
function orderAt(t){return ORD.map(id=>{let best=1e9;for(const r of REL)if(r[1]===id){const a=cyc(t-r[0]);if(a<best)best=a}return[id,best]}).sort((a,b)=>a[1]-b[1]).map(e=>e[0])}
function lastRel(){let best=REL[0],ba=1e9;for(const r of REL){const a=cyc(T-r[0]);if(a<ba){ba=a;best=r}}return[best,ba]}

// ======================= HABITACIONES: ANTHROPIC =======================
function A0(x,y){R(x,y-2,RW,2,'#d8c7a6');
  spark(x+20,y-27,5,'#d97757',T*TAU/60);
  person(x+17,y-4,{shirt:'#3d3929',hair:HAIR[5],skin:SKIN[1]});
  R(x+6,y-9,30,9,'#d97757');R(x+5,y-10,32,2,'#3d3929');txt('HOLA',x+13,y-7,'#fff3e0');
  poster(x+41,y-33,23,15,'#3d3929',['FORMA','S-1'],'#f5c26b');
  door(x+65,y,'#7a4630','#f6dcc0');
  txt('SALIDA A BOLSA',x+82,y-35,'#b0563a');txt('ANT $70-78',x+82,y-29,fr(2)%2?'#2b8a3e':'#37b24d');

  for(let r=0;r<3;r++)for(let c=0;c<3;c++)R(x+127+c*3,y-25+r*5,2,2,'#7d8590');
  R(x+138,y-24,2,6,'#d97757');R(x+126,y-8,14,4,'#111111');P(x+139,y-15,fr(2)%2?'#33ff66':'#225533');
  say(x+86,y-14,'¡QUIERO ACCIONES!',40,12,18);say(x+19,y-14,'7 FUNDADORES: $250M C/U',40,32,38);
  say(x+133,y-30,'¿CUBO DE TUNGSTENO?',40,3,9);say(x+133,y-30,'TRAIGO SACO AZUL',40,22,29);}
function A1(x,y){R(x,y-2,RW,2,'#d8c7a6');
  monitor(x+5,y-35,54,26,'#16261a');txt('CLAUDE JUEGA',x+8,y-33,'#f5c26b');

  const pp=(T%8)/8*4,seg=Math.min(3,Math.floor(pp)),k=pp-seg,pts=[[14,-25],[40,-25],[40,-14],[14,-14],[14,-25]];
  R(x+pts[seg][0]+(pts[seg+1][0]-pts[seg][0])*k,y+pts[seg][1]+(pts[seg+1][1]-pts[seg][1])*k,3,3,'#ff8a5c');
  txt('ATORADO: 72 H',x+7,y-8,'#b0563a');
  for(let i=0;i<2;i++){ell(x+68+i*12,y-3,5,3,i?'#6b8e9f':'#d97757');person(x+66+i*12,y-4,{sit:1,dir:-1,shirt:i?'#e9c46a':'#8a5a44',hair:HAIR[i+3],skin:SKIN[i*3]})}
  say(x+68,y-16,'¡A LA IZQUIERDA!',30,4,9);say(x+80,y-16,'¡OTRA VEZ LA CUEVA!',30,16,22);
  monitor(x+92,y-35,48,22,'#1b1b1f');txt('CLAUDE CODE',x+95,y-33,'#d97757');
  const base=Math.floor(T/1.5),f=(T/1.5)%1;
  for(let r=0;r<4;r++){const wl=6+hh(base+r)*34;R(x+95,y-26+r*3,r===3?wl*f:wl,1,['#d97757','#8fd694','#888888','#f5c26b'][(base+r)%4])}
  ell(x+112,y-3,11,3,'#6b8e9f');R(x+105,y-8,10,3,'#c96a4a');R(x+115,y-9,4,4,SKIN[1]);R(x+115,y-10,4,1,HAIR[0]);R(x+99,y-7,6,2,'#2b3046');
  say(x+116,y-13,'¡TIENES TODA LA RAZON!',20,3,9,'#1b1b1f','#f5c26b');}
function A2(x,y){R(x,y-2,RW,2,'#d8c7a6');
  R(x+5,y-34,50,25,'#f1dfae');R(x+3,y-36,54,3,'#c9a86a');R(x+3,y-10,54,3,'#c9a86a');

  person(x+59,y,{dir:-1,armUp:'L',shirt:'#8a5a44',hair:HAIR[3],skin:SKIN[0]});line(x+58,y-13,x+56,y-17,'#ffffff');
  board(x+68,y-35,39,21,['SE BUENO','SE VERAZ','0 CLIPS'],['#22aa77','#2277aa','#cc3333']);
  txt('BIENESTAR',x+109,y-35,'#b0563a');

  say(x+138,y-15,'¿Y COMO TE SIENTES?',40,5,11);say(x+114,y-13,'INCIERTO',40,13,18);}
function A3(x,y){R(x,y-2,RW,2,'#cdbf9f');
  R(x+8,y-33,42,31,'#dff1f5');R(x+8,y-33,42,1,'#99cccc');R(x+8,y-3,42,1,'#99cccc');R(x+8,y-33,1,31,'#99cccc');R(x+49,y-33,1,31,'#99cccc');R(x+12,y-36,34,3,'#8a8f98');
